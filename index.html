const OPENING = "Hey, what are you making?";
const MODEL = "claude-sonnet-4-6";

const hist = [];
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

function addMsg(role, text) {
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  const dot = document.createElement("div");
  dot.className = "msg-dot";
  const body = document.createElement("div");
  body.className = "msg-text";
  body.textContent = text;
  row.appendChild(dot);
  row.appendChild(body);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function callAPI(messages) {
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1000,
      system: SYS,
      messages: messages
    })
  });

  const raw = await response.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    throw new Error("Server did not return JSON. It said: " + raw.slice(0, 300));
  }

  if (!response.ok) {
    const detail = data && data.error ? data.error.message : raw.slice(0, 300);
    throw new Error("API " + response.status + ": " + detail);
  }

  const text = (data.content || [])
    .filter(function (b) { return b.type === "text"; })
    .map(function (b) { return b.text; })
    .join("\n")
    .trim();

  if (!text) throw new Error("Empty response from the model.");
  return text;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  sendEl.disabled = true;
  addMsg("user", text);
  hist.push({ role: "user", content: text });

  const loading = document.createElement("div");
  loading.className = "loading";
  loading.textContent = "Thinking...";
  messagesEl.appendChild(loading);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const reply = await callAPI(hist);
    loading.remove();
    addMsg("bot", reply);
    hist.push({ role: "assistant", content: reply });
  } catch (err) {
    loading.remove();
    addMsg("error", err.message);
    hist.pop();
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.onclick = send;
inputEl.addEventListener("keypress", function (e) {
  if (e.key === "Enter") send();
});

addMsg("bot", OPENING);
